<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Insight RAG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232635;
      --border: #2e3248;
      --accent: #4f7ef8;
      --accent-hover: #3d6ae6;
      --user-bubble: #1e3a8a;
      --ai-bubble: #1a1d27;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --green: #22c55e;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    label[for="collection"] {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    #collection {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      min-width: 180px;
    }

    #collection:focus { border-color: var(--accent); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state .big-icon { font-size: 48px; }
    .empty-state h2 { font-size: 20px; color: var(--text); font-weight: 600; }
    .empty-state p { font-size: 14px; max-width: 360px; line-height: 1.6; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Messages */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
    }

    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
    }

    .msg-row.user .avatar { background: var(--accent); }
    .msg-row.ai .avatar   { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.65;
      max-width: calc(100% - 44px);
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .msg-row.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Thinking spinner */
    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }

    .thinking span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Sources */
    .sources-toggle {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .sources-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      transition: color 0.15s;
    }

    .sources-btn:hover { color: var(--text); }

    .sources-btn .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }

    .sources-btn.open .arrow { transform: rotate(180deg); }

    .sources-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .source-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .source-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .source-name {
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .source-meta {
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .source-snippet {
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .score-badge {
      background: rgba(79, 126, 248, 0.15);
      color: var(--accent);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      white-space: nowrap;
    }

    /* ── Input bar ── */
    #input-bar {
      padding: 16px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color 0.15s;
      max-width: 860px;
      margin: 0 auto;
    }

    .input-wrap:focus-within { border-color: var(--accent); }

    #query {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
    }

    #query::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; fill: white; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📊</div>
    Finance Insight RAG
  </div>
  <div class="header-right">
    <div class="status-dot" title="서버 연결됨"></div>
    <label for="collection">컬렉션</label>
    <select id="collection">
      <option value="">불러오는 중…</option>
    </select>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">
    <div class="big-icon">💬</div>
    <h2>금융 문서에 질문해보세요</h2>
    <p>RAG 파이프라인이 Qdrant에서 관련 문서를 검색하고 GPT-4o-mini로 답변합니다.</p>
    <div class="suggestions">
      <div class="suggestion-chip" onclick="fillQuery(this)">Tesla의 2023년 총 매출은 얼마인가요?</div>
      <div class="suggestion-chip" onclick="fillQuery(this)">주요 리스크 요인은 무엇인가요?</div>
      <div class="suggestion-chip" onclick="fillQuery(this)">영업이익률 추이를 설명해주세요.</div>
      <div class="suggestion-chip" onclick="fillQuery(this)">R&D 투자 현황은 어떤가요?</div>
    </div>
  </div>
</div>

<div id="input-bar">
  <div class="input-wrap">
    <textarea id="query" rows="1" placeholder="금융 문서에 대해 질문하세요…"></textarea>
    <button id="send-btn" title="전송 (Enter)">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter로 전송 · Shift+Enter로 줄 바꿈</div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const queryEl = document.getElementById('query');
  const sendBtn = document.getElementById('send-btn');
  const collectionEl = document.getElementById('collection');
  const emptyState = document.getElementById('empty-state');

  let isLoading = false;

  // ── Auto-resize textarea ──
  queryEl.addEventListener('input', () => {
    queryEl.style.height = 'auto';
    queryEl.style.height = Math.min(queryEl.scrollHeight, 160) + 'px';
  });

  // ── Keyboard shortcuts ──
  queryEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  sendBtn.addEventListener('click', submit);

  // ── Load collections ──
  async function loadCollections() {
    try {
      const res = await fetch('/collections');
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      collectionEl.innerHTML = '';
      if (data.collections.length === 0) {
        collectionEl.innerHTML = '<option value="">컬렉션 없음</option>';
        return;
      }
      data.collections.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        collectionEl.appendChild(opt);
      });
    } catch (err) {
      collectionEl.innerHTML = '<option value="">로드 실패</option>';
      console.error('컬렉션 로드 실패:', err);
    }
  }

  // ── Suggestion chips ──
  function fillQuery(el) {
    queryEl.value = el.textContent;
    queryEl.dispatchEvent(new Event('input'));
    queryEl.focus();
  }

  // ── Submit ──
  async function submit() {
    const query = queryEl.value.trim();
    const collection = collectionEl.value;

    if (!query || isLoading || !collection) return;

    emptyState.style.display = 'none';
    isLoading = true;
    sendBtn.disabled = true;

    appendUserMessage(query);
    queryEl.value = '';
    queryEl.style.height = 'auto';

    const thinkingEl = appendThinking();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, collection_name: collection }),
      });

      thinkingEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        appendAIMessage(`오류가 발생했습니다: ${err.detail || res.statusText}`, []);
      } else {
        const data = await res.json();
        appendAIMessage(data.answer, data.sources || []);
      }
    } catch (err) {
      thinkingEl.remove();
      appendAIMessage(`네트워크 오류: ${err.message}`, []);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      queryEl.focus();
    }
  }

  // ── Render helpers ──
  function appendUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar">나</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    chatEl.appendChild(row);
    scrollToBottom();
  }

  function appendThinking() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="thinking">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chatEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function appendAIMessage(answer, sources) {
    const row = document.createElement('div');
    row.className = 'msg-row ai';

    const sourcesHtml = sources.length > 0 ? buildSourcesHtml(sources) : '';

    row.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="answer-text">${formatAnswer(answer)}</div>
        ${sourcesHtml}
      </div>
    `;

    chatEl.appendChild(row);
    scrollToBottom();
  }

  function buildSourcesHtml(sources) {
    const cards = sources.map(s => {
      const score = s.relevance_score != null
        ? `<span class="score-badge">관련도 ${(s.relevance_score * 100).toFixed(1)}%</span>`
        : '';
      return `
        <div class="source-card">
          <div class="source-card-header">
            <span class="source-name" title="${escapeHtml(s.source)}">📄 ${escapeHtml(s.source)}</span>
            ${score}
            <span class="source-meta">p.${s.page}</span>
          </div>
          <div class="source-snippet">${escapeHtml(s.snippet)}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="sources-toggle">
        <button class="sources-btn" onclick="toggleSources(this)">
          <span class="arrow">▼</span>
          출처 ${sources.length}개 보기
        </button>
        <div class="sources-list" style="display:none">${cards}</div>
      </div>
    `;
  }

  function toggleSources(btn) {
    const list = btn.nextElementSibling;
    const isOpen = list.style.display !== 'none';
    list.style.display = isOpen ? 'none' : 'flex';
    btn.classList.toggle('open', !isOpen);
    btn.querySelector('span:last-child') && (btn.lastChild.textContent = isOpen
      ? ` 출처 보기`
      : ` 출처 닫기`);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatAnswer(text) {
    // 기본 마크다운: bold, 줄바꿈
    return escapeHtml(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ── Init ──
  loadCollections();
</script>
</body>
</html>
